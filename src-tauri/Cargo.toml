[package]
name = "carelo"
version = "0.8.2"
description = "Fast, local-first file management with dual panes and custom tools."
authors = ["Agentejo - Artur Heinze"]
edition = "2021"
rust-version = "1.85"

[lib]
name = "carelo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
opendal = { version = "0.56", features = [
    "services-b2",
    "services-dropbox",
    "services-fs",
    "services-ftp",
    "services-gdrive",
    "services-memory",
    "services-onedrive",
    "services-s3",
    "services-sftp",
    "services-swift",
    "services-webdav",
] }
openssh = "0.11.6"
openssh-sftp-client = "0.15.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
libc = "0.2"
base64 = "0.22"
rand = "0.9"
reqwest = { version = "0.13", default-features = false, features = ["form", "json", "query", "rustls"] }
regex = "1.12"
quick-xml = "0.39"
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
url = "2"
nucleo-matcher = "0.3.1"
ignore = "0.4.25"
pdf-extract = "0.10.0"
zip = { version = "0.6.6", default-features = false, features = ["deflate"] }
tar = "0.4"
flate2 = "1"
zstd = "0.13"
notify = "6"
sevenz-rust2 = { version = "0.20.2", features = ["deflate", "lz4", "zstd", "brotli"] }
trash = "5.2.6"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-process = "2"
tauri-plugin-updater = "2"

[target.'cfg(target_os = "linux")'.dependencies]
gdk = "0.18.2"
gtk = "0.18.2"
